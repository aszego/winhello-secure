name: Release Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          RUN=${{ github.run_number }}
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            ASSEMBLY_VERSION="${VERSION}.0"
            FILE_VERSION="${VERSION}.${RUN}"
          else
            VERSION_PREFIX=1.0.0
            case "${{ github.event_name }}" in
              pull_request) SUFFIX="-pr" ;;
              workflow_dispatch) SUFFIX="-manual" ;;
              *) SUFFIX="-ci" ;;
            esac
            VERSION="${VERSION_PREFIX}${SUFFIX}.${RUN}"
            ASSEMBLY_VERSION="${VERSION_PREFIX}.0"
            FILE_VERSION="${VERSION_PREFIX}.0.${RUN}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "assembly_version=${ASSEMBLY_VERSION}" >> $GITHUB_OUTPUT
          echo "file_version=${FILE_VERSION}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} -p:FileVersion=${{ steps.version.outputs.file_version }}

      - name: Publish (Release)
        run: dotnet publish winhello-secure/winhello-secure.csproj -c Release --no-build -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winhello-secure-${{ steps.version.outputs.version }}
          path: publish
