name: CI Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      file_version: ${{ steps.version.outputs.file_version }}
    steps:
      - name: Compute version
        id: version
        run: |
          RUN=${{ github.run_number }}
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            ASSEMBLY_VERSION="${VERSION}.0"
            FILE_VERSION="${VERSION}.${RUN}"
          else
            VERSION_PREFIX=1.0.0
            case "${{ github.event_name }}" in
              pull_request) SUFFIX="-pr" ;;
              workflow_dispatch) SUFFIX="-manual" ;;
              *) SUFFIX="-ci" ;;
            esac
            VERSION="${VERSION_PREFIX}${SUFFIX}.${RUN}"
            ASSEMBLY_VERSION="${VERSION_PREFIX}.0"
            FILE_VERSION="${VERSION_PREFIX}.0.${RUN}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "assembly_version=${ASSEMBLY_VERSION}" >> $GITHUB_OUTPUT
          echo "file_version=${FILE_VERSION}" >> $GITHUB_OUTPUT
        shell: bash

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      assembly_version: ${{ needs.version.outputs.assembly_version }}
      file_version: ${{ needs.version.outputs.file_version }}
