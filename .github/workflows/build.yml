name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      assembly_version:
        required: true
        type: string
      file_version:
        required: true
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
      standalone_artifact_name:
        value: ${{ jobs.build.outputs.standalone_artifact_name }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore -p:Version=${{ inputs.version }} -p:AssemblyVersion=${{ inputs.assembly_version }} -p:FileVersion=${{ inputs.file_version }}

      - name: Publish (Release)
        run: dotnet publish winhello-secure/winhello-secure.csproj -c Release --no-build -o publish -p:PublishSingleFile=true -p:DebugSymbols=false

      - name: Publish (Standalone)
        run: dotnet publish winhello-secure/winhello-secure.csproj -c Release -o publish-standalone -p:PublishSingleFile=true -p:DebugSymbols=false -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=true -p:TrimMode=full

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winhello-secure-${{ inputs.version }}
          path: publish

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: winhello-secure-standalone-${{ inputs.version }}
          path: publish-standalone

      - id: artifact
        run: |
          echo "artifact_name=winhello-secure-${{ inputs.version }}" >> $GITHUB_OUTPUT
          echo "standalone_artifact_name=winhello-secure-standalone-${{ inputs.version }}" >> $GITHUB_OUTPUT
        shell: bash

    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      standalone_artifact_name: ${{ steps.artifact.outputs.standalone_artifact_name }}
