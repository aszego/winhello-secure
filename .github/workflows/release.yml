name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      assembly_version: ${{ needs.version.outputs.version }}.0
      file_version: ${{ needs.version.outputs.version }}.0

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release
      - name: List and compress
        run: |
          Write-Host "Contents of release folder:"
          Get-ChildItem -Path release -Recurse | ForEach-Object { Write-Host $_.FullName }
          $zipPath = "winhello-secure-${{ github.event.inputs.tag }}.zip"
          Compress-Archive -Path release\* -DestinationPath $zipPath -Force
          Write-Host "Zip created: $zipPath"
          Write-Host "Zip exists: $(Test-Path $zipPath)"
          Get-ChildItem -Filter *.zip
      - run: gh release create ${{ github.event.inputs.tag }} winhello-secure-${{ github.event.inputs.tag }}.zip --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
