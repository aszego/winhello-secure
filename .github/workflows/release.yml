name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      assembly_version: ${{ needs.version.outputs.version }}.0
      file_version: ${{ needs.version.outputs.version }}.0

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: winhello-secure-standalone-${{ needs.version.outputs.version }}
          path: release-standalone
      - name: Create release packages
        run: |
          Write-Host "Contents of release folder:"
          Get-ChildItem -Path release -Recurse | ForEach-Object { Write-Host $_.FullName }
          $zipName = "winhello-secure-${{ github.event.inputs.tag }}.zip"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          Compress-Archive -Path release\* -DestinationPath $zipPath -Force
          $standaloneZipName = "winhello-secure-standalone-${{ github.event.inputs.tag }}.zip"
          $standaloneZipPath = Join-Path $env:GITHUB_WORKSPACE $standaloneZipName
          Compress-Archive -Path release-standalone\* -DestinationPath $standaloneZipPath -Force
          Write-Host "Zip created: $zipPath"
          Write-Host "Standalone zip created: $standaloneZipPath"
          gh release create ${{ github.event.inputs.tag }} $zipPath $standaloneZipPath --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
